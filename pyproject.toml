[project]
name = "agentic-profile-matching"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.11",
    "numpy>=2.4.2",
    "openai>=2.28.0",
    "pgvector>=0.4.2",
    "prompt-toolkit>=3.0.52",
    "psycopg2>=2.9.11",
    "pymupdf>=1.27.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "sqlalchemy>=2.0.48",
]


[project.scripts]
apm-app = "agentic_profile_matching.main:main"
apm-ingestion = "agentic_profile_matching.adapters.ingestion.ingestion:main"

apm-migrate-init = "agentic_profile_matching.scripts.migrations:init_migration"
apm-migrate-up = "agentic_profile_matching.scripts.migrations:upgrade_head"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"


[tool.mypy]
python_version = "3.13"
strict = true
